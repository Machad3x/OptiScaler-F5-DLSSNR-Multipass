name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version Tag'
        required: true
        default: 'v0.1.33'
        type: string
      include_dlss_fg:
        description: 'Include DLSS Frame Generation runtime'
        required: false
        default: false
        type: boolean
      accept_nvidia_licenses:
        description: 'Accept NVIDIA Licenses (if Include DLSS FG is checked)'
        required: false
        default: false
        type: boolean
      f5low_kit_url:
        description: 'f5low kit zip (https URL, e.g. an Optional-f5low-*.zip release asset); goes into plugins\. Empty = none'
        required: false
        default: ''
        type: string
      f5low_kit_sha256:
        description: 'SHA-256 of that zip (required with the URL)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # The kit is built from a private repo, so it comes in as a prebuilt zip, pinned by its hash. Inputs reach the
    # script through env only, never pasted into it.
    - name: Fetch f5low kit
      if: ${{ inputs.f5low_kit_url != '' }}
      shell: powershell
      env:
        KIT_URL: ${{ inputs.f5low_kit_url }}
        KIT_SHA256: ${{ inputs.f5low_kit_sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:KIT_URL -notmatch '^https://') { throw 'f5low_kit_url must be an https URL' }
        if ($env:KIT_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') { throw 'f5low_kit_sha256 must be a 64-digit SHA-256' }
        $zip = Join-Path $env:RUNNER_TEMP 'f5low_kit.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'f5low_kit'
        Invoke-WebRequest -Uri $env:KIT_URL -OutFile $zip -UseBasicParsing
        $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($hash -ne $env:KIT_SHA256.ToUpperInvariant()) { throw "f5low kit hash mismatch: got $hash" }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir
        $dll = @(Get-ChildItem -LiteralPath $dir -Recurse -File -Filter 'f5low.dll')
        if ($dll.Count -ne 1) { throw "expected one f5low.dll in the kit, found $($dll.Count)" }
        "F5LOW_KIT=$($dll[0].DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Run package_release.ps1
      shell: powershell
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        $params = @{
            Version = $env:PACKAGE_VERSION
        }
        if ($env:F5LOW_KIT) {
            $params["F5LowKit"] = $env:F5LOW_KIT
        }
        if ("${{ inputs.include_dlss_fg }}" -eq "true") {
            $params["IncludeDlssFrameGeneration"] = $true
        }
        if ("${{ inputs.accept_nvidia_licenses }}" -eq "true") {
            $params["AcceptNvidiaLicenses"] = $true
        }

        Write-Host "Executing package_release.ps1 with options:"
        $params.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }

        & .\package_release.ps1 @params
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
        }

    - name: Upload Release Archive
      uses: actions/upload-artifact@v4
      with:
        name: OptiScaler-Release-Package-${{ inputs.version }}
        path: release/*.zip
        if-no-files-found: error
