name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version Tag'
        required: true
        default: 'v0.1.33'
        type: string
      include_dlss_fg:
        description: 'Include DLSS Frame Generation runtime'
        required: false
        default: false
        type: boolean
      accept_nvidia_licenses:
        description: 'Accept NVIDIA Licenses (if Include DLSS FG is checked)'
        required: false
        default: false
        type: boolean
      f5low_kit_url:
        description: 'f5low kit zip (https URL: the f5low-kit-*.zip release asset of f5low-fg). Required unless no_f5low is ticked'
        required: false
        default: ''
        type: string
      f5low_kit_sha256:
        description: 'SHA-256 of that zip (required with the URL)'
        required: false
        default: ''
        type: string
      no_f5low:
        description: 'Package without F5Low (no f5low.dll, libxess_fg stays 1.3.1.78)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # A release must not silently lack F5Low: refuse before anything is built
    - name: Check inputs
      shell: powershell
      env:
        KIT_URL: ${{ inputs.f5low_kit_url }}
        KIT_SHA256: ${{ inputs.f5low_kit_sha256 }}
        NO_F5LOW: ${{ inputs.no_f5low }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:NO_F5LOW -ne 'true') {
            if (-not $env:KIT_URL) { throw 'Give f5low_kit_url and f5low_kit_sha256, or tick no_f5low to package without F5Low' }
            if ($env:KIT_URL -notmatch '^https://') { throw 'f5low_kit_url must be an https URL' }
            if ($env:KIT_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') { throw 'f5low_kit_sha256 must be a 64-digit SHA-256' }
        }

    # The kit comes from the f5low-fg repo as a zip, pinned by its hash; package_release.ps1 checks it again and
    # everything inside it. Inputs reach the script through env only, never pasted into it.
    - name: Fetch f5low kit
      if: ${{ inputs.no_f5low != true }}
      shell: powershell
      env:
        KIT_URL: ${{ inputs.f5low_kit_url }}
        KIT_SHA256: ${{ inputs.f5low_kit_sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'f5low_kit.zip'
        Invoke-WebRequest -Uri $env:KIT_URL -OutFile $zip -UseBasicParsing
        "F5LOW_KIT_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Run package_release.ps1
      shell: powershell
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        $params = @{
            Version = $env:PACKAGE_VERSION
        }
        if ("${{ inputs.no_f5low }}" -eq "true") {
            $params["NoF5Low"] = $true
        }
        elseif ($env:F5LOW_KIT_ZIP) {
            $params["F5LowKit"] = $env:F5LOW_KIT_ZIP
            $params["F5LowKitSha256"] = "${{ inputs.f5low_kit_sha256 }}"
        }
        if ("${{ inputs.include_dlss_fg }}" -eq "true") {
            $params["IncludeDlssFrameGeneration"] = $true
        }
        if ("${{ inputs.accept_nvidia_licenses }}" -eq "true") {
            $params["AcceptNvidiaLicenses"] = $true
        }

        Write-Host "Executing package_release.ps1 with options:"
        $params.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }

        & .\package_release.ps1 @params
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
        }

    - name: Upload Release Archive
      uses: actions/upload-artifact@v4
      with:
        name: OptiScaler-Release-Package-${{ inputs.version }}
        path: release/*.zip
        if-no-files-found: error
